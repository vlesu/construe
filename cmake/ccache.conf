# ccache settings of the build with CONSTRUE_CCACHE=ON (cmake/BuildCache.cmake, FX14-CI-001), read through
# CCACHE_CONFIGPATH; environment variables (CCACHE_DIR, ...) take precedence. The cache can be moved between machines
# with the same compiler, the same dependency tree and the same clone path; base_dir is set by the launcher to the
# source root, so paths inside the tree are hashed relative to it.
cache_dir = /opt/construe-ccache
# Debug info and the working directory: the build directory differs between clones only by its prefix.
hash_dir = false
# Precompiled headers (target_precompile_headers): ccache needs these to cache units built with a PCH; the include
# mtime checks are off because a fresh clone gives every file a new mtime (contents are hashed anyway).
sloppiness = pch_defines,time_macros,include_file_mtime,include_file_ctime
# Compiler identity by contents: a new container has the same g++ binary with another inode.
compiler_check = content
# Room for both configurations (Release and Debug); the archive holds what is used.
max_size = 12G
compression = true
compression_level = 1
